[package]
name = "axiom-grid"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Axiom-Grid local-only explicit-context preview runtime"
[workspace]
[dependencies]
libc = "0.2"
anyhow = "1"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
yrs = "0.21"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
