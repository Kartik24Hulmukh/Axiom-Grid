# =============================================================================
# Kairo-Phantom — Rust toolchain pin (reproducible builds)
# =============================================================================
# Pinned to a specific stable version for reproducibility across CI, GPU
# runner, and developer machines. Bump intentionally in a dedicated PR.
# =============================================================================

[toolchain]
channel = "1.88.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
# Host target is installed by rustup. Add cross-compilation targets explicitly
# on the machines that need them; this does not supply native platform SDKs.
