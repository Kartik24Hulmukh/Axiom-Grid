worker_processes auto;
events { worker_connections 4096; }
http {
  # Edge tenant auth: API keys are validated by the app (SEC-006); the edge enforces TLS, body caps,
  # per-IP burst limits and blocks operator-only routes from the public internet.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
  client_max_body_size 2m;
  upstream axiom { server api:8765; keepalive 64; }
  server {
    listen 80; return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Operator-only surfaces are NOT reachable from the public edge.
    location = /metrics { return 404; }
    location = /readyz  { return 404; }
    location = /livez   { return 404; }
    location / {
      limit_req zone=perip burst=100 nodelay;
      proxy_pass http://axiom;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }
}
