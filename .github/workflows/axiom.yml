name: Axiom-Grid focused preview gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --manifest-path axiom-runtime/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo test --manifest-path axiom-runtime/Cargo.toml --locked
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo clippy --manifest-path axiom-runtime/Cargo.toml --locked --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: node --test phantom-overlay/tests/app.test.cjs
      - run: python3 tests/test_axiom_launcher.py
      - run: cargo build --manifest-path axiom-runtime/Cargo.toml --locked --release
        env:
          RUSTUP_TOOLCHAIN: 1.98.1

  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path phantom-overlay/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path phantom-overlay/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path phantom-overlay/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path phantom-overlay/src-tauri/Cargo.toml --locked
