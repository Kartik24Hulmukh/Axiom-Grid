name: Axiom-Grid focused preview gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --manifest-path axiom-runtime/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo test --manifest-path axiom-runtime/Cargo.toml --locked
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo clippy --manifest-path axiom-runtime/Cargo.toml --locked --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: node --test phantom-overlay/tests/app.test.cjs
      - name: Validate real-model runner syntax
        run: python3 -m py_compile scripts/axiom-live-e2e.py
      - name: Python lint gate (ruff E9/F - syntax errors, undefined names, unused imports)
        run: |
          python3 -m pip install --quiet ruff
          python3 -m ruff check --select E9,F overlay kernel scripts/stress_sec006_gauntlet.py stress_test.py
      - name: Overlay server gate (real provenance digest, strict input schema)
        run: |
          python3 -m pip install --quiet pytest pytest-asyncio fastapi httpx uvicorn ruff psutil
          python3 -m pytest -q -p no:cacheprovider overlay/tests/test_server.py overlay/tests/test_server_hardening.py overlay/tests/test_server_wave8.py overlay/tests/test_server_wave9.py kernel/tests/test_melious_router.py overlay/tests/test_server_wave11.py kernel/tests/test_melious_router_wave11.py
      - name: Wave 11 changed-file lint gate
        run: python3 -m ruff check overlay/server.py kernel/sidecar/melious_router.py overlay/tests/test_server_wave11.py kernel/tests/test_melious_router_wave11.py scripts/stress_wave11.py
      - name: Wave 11 undrained-stderr spike and shutdown gate
        run: python3 scripts/stress_wave11.py
      - name: Ops endpoints smoke gate (healthz/readyz/metrics, security headers)
        run: |
          python3 - <<'PY'
          import sys
          from fastapi.testclient import TestClient
          from overlay.server import app
          c = TestClient(app)
          assert c.get('/healthz').status_code == 200
          assert c.get('/livez').status_code == 200, 'healthz failed'
          r = c.get('/readyz')
          assert r.status_code == 200 and r.json()['status'] == 'ready', f'readyz failed: {r.status_code}'
          m = c.get('/metrics').json()
          assert c.get('/metrics?format=prometheus').status_code == 200
          assert m['requests_total'] >= 2, 'metrics not counting'
          hdrs = c.get('/').headers
          assert hdrs.get('x-frame-options') == 'DENY', 'missing security headers'
          print('OPS SMOKE GATE: PASS')
          PY
      - name: Wedge pack ground-truth F1 gate (offline deterministic extraction >= 0.80)
        run: python3 packs/memo/eval_wedge.py
      - name: Wedge pack ADVERSARIAL generalization gate (label-synonym/format invariance >= 0.80)
        run: python3 packs/memo/eval_adversarial.py
      - name: SEC-006 auth gauntlet (live socket, 10 traffic classes)
        run: python3 scripts/stress_sec006_gauntlet.py
      - name: 100x Concurrency stress & security probe gate
        run: python3 stress_test.py
      - run: cargo build --manifest-path axiom-runtime/Cargo.toml --locked --release
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
  focused-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - run: cargo fmt --manifest-path phantom-overlay/src-tauri/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo clippy --manifest-path phantom-overlay/src-tauri/Cargo.toml --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo build --manifest-path phantom-overlay/src-tauri/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: node --check phantom-overlay/dist/app.js
