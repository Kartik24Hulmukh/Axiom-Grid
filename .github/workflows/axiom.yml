name: Axiom-Grid focused preview gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --manifest-path axiom-runtime/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo test --manifest-path axiom-runtime/Cargo.toml --locked
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo clippy --manifest-path axiom-runtime/Cargo.toml --locked --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: node --test phantom-overlay/tests/app.test.cjs
      - name: Validate real-model runner syntax
        run: python3 -m py_compile scripts/axiom-live-e2e.py
      - name: Python lint gate (ruff E9/F - syntax errors, undefined names, unused imports)
        run: |
          python3 -m pip install --quiet ruff
          python3 -m ruff check --select E9,F overlay kernel kairo/context/compressor.py scripts/stress_sec006_gauntlet.py stress_test.py
      - name: Overlay server gate (real provenance digest, strict input schema)
        run: |
          python3 -m pip install --quiet pytest pytest-asyncio hypothesis fastapi httpx uvicorn ruff psutil pdfplumber==0.11.10 python-docx==1.2.0 opentelemetry-sdk==1.44.0
          python3 -m pytest -q -p no:cacheprovider overlay/tests kernel/tests tests/test_concurrency_safety.py -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning
      - name: Concurrency posture gate (pipeline gate must be parallel, never a global mutex)
        run: |
          python3 - <<'PY'
          from overlay.server import orchestrator_gate, PIPELINE_CONCURRENCY, EXTRACTION_WORKERS
          assert orchestrator_gate.limit > 1, f"global serialization reintroduced: limit={orchestrator_gate.limit}"
          assert orchestrator_gate.limit == PIPELINE_CONCURRENCY
          assert EXTRACTION_WORKERS >= 4, EXTRACTION_WORKERS
          print(f"CONCURRENCY POSTURE GATE: PASS (pipeline={PIPELINE_CONCURRENCY}, extraction_workers={EXTRACTION_WORKERS})")
          PY
      - name: Wave 11 changed-file lint gate
        run: python3 -m ruff check overlay/server.py kernel/sidecar/melious_router.py overlay/tests/test_server_wave11.py kernel/tests/test_melious_router_wave11.py scripts/stress_wave11.py
      - name: Wave 11 undrained-stderr spike and shutdown gate
        run: python3 scripts/stress_wave11.py
      - name: Ops endpoints smoke gate (healthz/readyz/metrics, security headers)
        run: |
          python3 - <<'PY'
          import sys
          from fastapi.testclient import TestClient
          from overlay.server import app
          c = TestClient(app)
          assert c.get('/healthz').status_code == 200
          assert c.get('/livez').status_code == 200, 'healthz failed'
          r = c.get('/readyz')
          assert r.status_code == 200 and r.json()['status'] == 'ready', f'readyz failed: {r.status_code}'
          m = c.get('/metrics').json()
          assert c.get('/metrics?format=prometheus').status_code == 200
          assert m['requests_total'] >= 2, 'metrics not counting'
          hdrs = c.get('/').headers
          assert hdrs.get('x-frame-options') == 'DENY', 'missing security headers'
          print('OPS SMOKE GATE: PASS')
          PY
      - name: Wedge pack ground-truth F1 gate (offline deterministic extraction >= 0.80)
        run: python3 packs/memo/eval_wedge.py
      - name: Wedge pack ADVERSARIAL generalization gate (label-synonym/format invariance >= 0.80)
        run: python3 packs/memo/eval_adversarial.py
      - name: SEC-006 auth gauntlet (live socket, 10 traffic classes)
        run: python3 scripts/stress_sec006_gauntlet.py
      - name: 100x Concurrency stress & security probe gate
        run: python3 stress_test.py
      - run: cargo build --manifest-path axiom-runtime/Cargo.toml --locked --release
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
  legacy-resource-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install resource regression dependencies
        run: python -m pip install pytest python-docx openpyxl numpy pdfminer.six pydantic
      - name: Fail on unclosed SQLite and ZIP resources
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          python -m pytest --import-mode=importlib -q
          kairo-sidecar/tests/test_mem_connection_lifecycle.py
          kairo-sidecar/tests/test_excel_archive_lifecycle.py
          kairo-sidecar/tests/test_mem_machine.py
          kairo-sidecar/test_phase0_1_e2e.py
          kairo-sidecar/test_phase0_1_opik.py
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning

  focused-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - run: cargo fmt --manifest-path phantom-overlay/src-tauri/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo clippy --manifest-path phantom-overlay/src-tauri/Cargo.toml --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: cargo build --manifest-path phantom-overlay/src-tauri/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - run: node --check phantom-overlay/dist/app.js

  overlay-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build exact overlay image
        run: docker build -t axiom-overlay:ci -f docker/Dockerfile.overlay .
      - name: Read-only non-root startup, private state and readiness
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name axiom-smoke --read-only --tmpfs /tmp --tmpfs /var/lib/axiom:uid=10001,gid=10001,mode=0700 \
            -e WEB_CONCURRENCY=1 -e AXIOM_OTEL_ENABLED=1 -e OTEL_TRACES_EXPORTER=none \
            -p 127.0.0.1:8765:8765 axiom-overlay:ci
          trap 'docker logs axiom-smoke; docker rm -f axiom-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/static/overlay_store.db)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"file":"sample_memo_01.txt"}' http://127.0.0.1:8765/demo)" = 503
          docker stop --time 20 axiom-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' axiom-smoke)" = 0

      - name: Authenticated real PDF and DOCX extraction in exact image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name axiom-intake --read-only --tmpfs /tmp --tmpfs /var/lib/axiom:uid=10001,gid=10001,mode=0700 \
            -e WEB_CONCURRENCY=1 -e AXIOM_API_KEYS=ci-only-intake-key -e OTEL_TRACES_EXPORTER=none \
            -p 127.0.0.1:8765:8765 axiom-overlay:ci
          trap 'docker logs axiom-intake; docker rm -f axiom-intake' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/readyz
          docker exec -i axiom-intake python3 < scripts/smoke_document_intake.py
          docker stop --time 20 axiom-intake
          test "$(docker inspect -f '{{.State.ExitCode}}' axiom-intake)" = 0
