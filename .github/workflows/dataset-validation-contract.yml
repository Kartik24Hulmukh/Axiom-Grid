name: Writing dataset rejection contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writing-dataset-rejection-contract:
    # Actual malformed-file rejection only; absent release asset stays skipped.
    # This job does NOT validate training data, rights, model quality or release.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test-only tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.10
      - name: Lint actual validator and negative contract
        run: >-
          python -m ruff check --select E9,F
          tests/test_writing_dataset.py
          tests/test_writing_dataset_rejection_contract.py
      - name: Reject malformed JSON and retain actual asset skip
        run: >-
          python -m pytest --noconftest --strict-markers --import-mode=importlib
          -q -p no:cacheprovider
          tests/test_writing_dataset_rejection_contract.py
          tests/test_writing_dataset.py
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
