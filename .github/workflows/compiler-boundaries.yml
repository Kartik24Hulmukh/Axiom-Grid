name: Native compiler content boundaries
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-component-boundaries:
    # Actual native builders and negative JVM guards, NOT JVM or offline-slide proof.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal pinned component-test tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.10
      - name: Lint native compiler and regressions
        run: >-
          python -m ruff check --select E9,F
          kairo-sidecar/sidecar/exporters/quarkdown_compiler.py
          tests/test_quarkdown_boundary_contract.py
      - name: Verify actual native files and reject unsupported formats
        # The contract hard-fails a bundled-JAR profile; no JVM/scanner substitute.
        run: >-
          python -m pytest --noconftest --strict-markers --import-mode=importlib
          -q -p no:cacheprovider
          tests/test_quarkdown_boundary_contract.py
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
