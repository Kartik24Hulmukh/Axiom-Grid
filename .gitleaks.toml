title = "Axiom-Grid strict secret scan"
[extend]
useDefault = true
[[rules]]
id = "melious-token"
description = "Melious provider bearer token"
regex = '''sk-mel-[A-Za-z0-9_-]{32,}'''
keywords = ["sk-mel-"]
# No global substring allowlists: hexadecimal characters or words such as
# "test" must never exempt a real credential. Review findings explicitly;
# fixture directories are not automatically secret-safe.
